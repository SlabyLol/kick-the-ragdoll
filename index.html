<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kick the Ragdoll</title>
<style>
body {margin:0; font-family:sans-serif; background:#f0f0f0; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh;}
button {margin:5px; padding:10px 20px; font-size:1rem; cursor:pointer;}
#weaponPanel, #coinDisplay, #gameCanvas {display:none; margin-top:10px;}
canvas {border:2px solid #333; background:#fff;}
</style>
</head>
<body>

<div id="startScreen">
  <h1>Kick the Ragdoll</h1>
  <p>Select device:</p>
  <button id="pcBtn">PC (Mouse)</button>
  <button id="mobileBtn">Mobile (Touch)</button>
</div>

<canvas id="gameCanvas"></canvas>
<div id="weaponPanel">
  <button data-weapon="bat">Bat</button>
  <button data-weapon="hammer">Hammer</button>
  <button data-weapon="punch">Punch</button>
  <button data-weapon="bomb">Bomb</button>
</div>
<div id="coinDisplay">Coins: <span id="coins">0</span></div>

<script>
document.addEventListener('DOMContentLoaded', ()=>{
    const startScreen = document.getElementById('startScreen');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const weaponPanel = document.getElementById('weaponPanel');
    const coinDisplay = document.getElementById('coinDisplay');
    let useMobileDrag = false;

    const pcBtn = document.getElementById('pcBtn');
    const mobileBtn = document.getElementById('mobileBtn');

    pcBtn.addEventListener('click',()=>startGame(false));
    mobileBtn.addEventListener('click',()=>startGame(true));

    function startGame(isMobile){
        useMobileDrag = isMobile;
        startScreen.style.display = 'none';
        canvas.style.display = 'block';
        weaponPanel.style.display = 'block';
        coinDisplay.style.display = 'block';

        canvas.width = window.innerWidth*0.9;
        canvas.height = window.innerHeight*0.7;

        initGame();
    }

    function initGame(){
        // einfacher Test-Ragdoll
        let x = canvas.width/2, y=100;
        function draw(){ 
            ctx.fillStyle='#fff';
            ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle='red';
            ctx.beginPath();
            ctx.arc(x,y,30,0,Math.PI*2);
            ctx.fill();
            requestAnimationFrame(draw);
        }
        draw();
    }
});
</script>

</body>
</html>
