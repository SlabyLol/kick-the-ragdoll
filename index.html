<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kick the Ragdoll+</title>
<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#eaeaea;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
}
button{padding:8px 16px;margin:4px;font-size:15px;cursor:pointer;}
canvas{background:#fff;border:2px solid #333;display:none;}
#ui{display:none;margin-top:8px;text-align:center;}
#healthBar{
  width:200px;height:18px;background:#444;margin:6px auto;position:relative;
}
#healthFill{
  height:100%;background:lime;width:100%;
}
</style>
</head>
<body>

<div id="startScreen">
  <h1>Kick the Ragdoll+</h1>
  <button id="startBtn">Start</button>
</div>

<canvas id="gameCanvas"></canvas>

<div id="ui">
  <div>Coins: <span id="coins">0</span></div>
  <div id="healthBar"><div id="healthFill"></div></div>

  <div id="shop">
    <button data-weapon="bat">Bat (Free)</button>
    <button data-weapon="hammer">Hammer (50)</button>
    <button data-weapon="bomb">Bomb (100)</button>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded",()=>{

const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");

let coins=0;
let health=100;
let maxHealth=100;

let currentWeapon=null;
let unlocked={bat:true, hammer:false, bomb:false};

let ragdollParts=[];
let constraints=[];
let gravity=0.5;
let floor;

document.getElementById("startBtn").onclick=startGame;

document.querySelectorAll("#shop button").forEach(btn=>{
  btn.onclick=()=>{
    let weapon=btn.dataset.weapon;
    let price=weapon==="hammer"?50:weapon==="bomb"?100:0;

    if(unlocked[weapon]){
      currentWeapon=weapon;
    }else{
      if(coins>=price){
        coins-=price;
        unlocked[weapon]=true;
        currentWeapon=weapon;
        updateCoins();
      }
    }
  }
});

function startGame(){
  document.getElementById("startScreen").style.display="none";
  canvas.style.display="block";
  document.getElementById("ui").style.display="block";

  canvas.width=window.innerWidth*0.9;
  canvas.height=window.innerHeight*0.75;
  floor=canvas.height;

  spawnRagdoll();
  loop();
}

function spawnRagdoll(){
  health=maxHealth;
  updateHealth();

  ragdollParts=[];
  constraints=[];

  class Part{
    constructor(x,y,r){
      this.x=x;this.y=y;this.oldx=x;this.oldy=y;this.r=r;
    }
    update(){
      let vx=this.x-this.oldx;
      let vy=this.y-this.oldy;

      this.oldx=this.x;
      this.oldy=this.y;

      this.x+=vx;
      this.y+=vy+gravity;

      if(this.y+this.r>floor){
        this.y=floor-this.r;
        this.oldy=this.y+vy*-0.5;
      }
    }
    draw(){
      ctx.beginPath();
      ctx.fillStyle="red";
      ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
      ctx.fill();
    }
  }

  class Constraint{
    constructor(a,b,l){this.a=a;this.b=b;this.l=l;}
    update(){
      let dx=this.b.x-this.a.x;
      let dy=this.b.y-this.a.y;
      let d=Math.sqrt(dx*dx+dy*dy);
      let diff=(this.l-d)/d/2;
      let ox=dx*diff;
      let oy=dy*diff;
      this.a.x-=ox;this.a.y-=oy;
      this.b.x+=ox;this.b.y+=oy;
    }
    draw(){
      ctx.strokeStyle="black";
      ctx.lineWidth=4;
      ctx.beginPath();
      ctx.moveTo(this.a.x,this.a.y);
      ctx.lineTo(this.b.x,this.b.y);
      ctx.stroke();
    }
  }

  let mid=canvas.width/2;

  let head=new Part(mid,120,18);
  let body=new Part(mid,170,25);
  let lArm=new Part(mid-40,170,10);
  let rArm=new Part(mid+40,170,10);
  let lLeg=new Part(mid-20,260,12);
  let rLeg=new Part(mid+20,260,12);

  ragdollParts=[head,body,lArm,rArm,lLeg,rLeg];

  constraints=[
    new Constraint(head,body,45),
    new Constraint(body,lArm,55),
    new Constraint(body,rArm,55),
    new Constraint(body,lLeg,85),
    new Constraint(body,rLeg,85)
  ];
}

function damage(amount){
  health-=amount;
  if(health<0)health=0;
  updateHealth();
  if(health===0){
    setTimeout(spawnRagdoll,1000);
  }
}

function updateHealth(){
  document.getElementById("healthFill").style.width=
    (health/maxHealth*100)+"%";
  document.getElementById("healthFill").style.background=
    health>50?"lime":health>20?"orange":"red";
}

function updateCoins(){
  document.getElementById("coins").innerText=coins;
}

canvas.onmousedown=e=>{
  ragdollParts.forEach(p=>{
    let dx=p.x-e.offsetX;
    let dy=p.y-e.offsetY;
    if(Math.sqrt(dx*dx+dy*dy)<30){
      if(currentWeapon==="bat"){p.oldx-=dx*0.5;damage(5);coins+=1;}
      if(currentWeapon==="hammer"){p.oldx-=dx*0.8;damage(12);coins+=2;}
      if(currentWeapon==="bomb"){
        ragdollParts.forEach(pp=>{
          pp.oldx-=dx*1.2;
        });
        damage(25);
        coins+=5;
      }
      updateCoins();
    }
  });
};

function update(){
  constraints.forEach(c=>c.update());
  ragdollParts.forEach(p=>p.update());

  // Respawn if out of screen
  ragdollParts.forEach(p=>{
    if(p.y>canvas.height+200){
      spawnRagdoll();
    }
  });
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  constraints.forEach(c=>c.draw());
  ragdollParts.forEach(p=>p.draw());
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

});
</script>
</body>
</html>
