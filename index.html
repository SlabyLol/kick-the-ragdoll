<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kick the Ragdoll</title>

<style>
body{
  margin:0;
  background:#ececec;
  font-family:sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
}
h1{margin:10px;}
canvas{
  background:white;
  border:3px solid #222;
  display:none;
}
#ui{display:none;text-align:center;}
button{
  padding:8px 14px;
  margin:4px;
  font-size:14px;
  cursor:pointer;
}
.free{background:#77dd77;}
.buy{background:#ffb347;}
#healthBar{
  width:220px;
  height:18px;
  background:#333;
  margin:auto;
}
#healthFill{
  height:100%;
  width:100%;
  background:lime;
}
</style>
</head>
<body>

<h1>Kick the Ragdoll</h1>

<div id="startScreen">
  <button id="pcBtn">PC Mode</button>
  <button id="mobileBtn">Mobile Mode</button>
</div>

<canvas id="gameCanvas"></canvas>

<div id="ui">
  <div>Coins: <span id="coins">0</span></div>
  <div id="healthBar"><div id="healthFill"></div></div>

  <div>
    <button class="free" data-weapon="punch">Punch (Free)</button>
    <button class="free" data-weapon="bat">Bat (Free)</button>
    <button class="free" data-weapon="hammer">Hammer (Free)</button>
  </div>
  <div>
    <button class="buy" data-weapon="bomb" data-price="100">Bomb (100)</button>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded",()=>{

const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");

let coins=0;
let health=100;
let maxHealth=100;

let currentWeapon="punch";
let unlocked={punch:true,bat:true,hammer:true,bomb:false};

let ragdollParts=[];
let constraints=[];
let gravity=0.6;
let floor;

let draggingPart=null;
let weaponObj=null;
let bombs=[];

document.getElementById("pcBtn").onclick=()=>startGame();
document.getElementById("mobileBtn").onclick=()=>startGame();

document.querySelectorAll("button[data-weapon]").forEach(btn=>{
  btn.onclick=()=>{
    const weapon=btn.dataset.weapon;
    const price=parseInt(btn.dataset.price||0);
    if(unlocked[weapon]){
      currentWeapon=weapon;
    } else if(coins>=price){
      coins-=price;
      unlocked[weapon]=true;
      currentWeapon=weapon;
      updateCoins();
    }
  };
});

function startGame(){
  document.getElementById("startScreen").style.display="none";
  canvas.style.display="block";
  document.getElementById("ui").style.display="block";

  canvas.width=window.innerWidth*0.9;
  canvas.height=window.innerHeight*0.65;
  floor=canvas.height;

  spawnRagdoll();
  loop();
}

class Part{
  constructor(x,y,r){
    this.x=x;this.y=y;this.oldx=x;this.oldy=y;this.r=r;
  }
  update(){
    let vx=this.x-this.oldx;
    let vy=this.y-this.oldy;
    this.oldx=this.x;
    this.oldy=this.y;
    this.x+=vx;
    this.y+=vy+gravity;

    if(this.y+this.r>floor){
      this.y=floor-this.r;
      this.oldy=this.y+vy*-0.4;
    }
  }
  draw(){
    ctx.fillStyle="red";
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
    ctx.fill();
  }
}

class Constraint{
  constructor(a,b,l){this.a=a;this.b=b;this.l=l;}
  update(){
    let dx=this.b.x-this.a.x;
    let dy=this.b.y-this.a.y;
    let d=Math.sqrt(dx*dx+dy*dy);
    let diff=(this.l-d)/d/2;
    let ox=dx*diff;
    let oy=dy*diff;
    this.a.x-=ox;this.a.y-=oy;
    this.b.x+=ox;this.b.y+=oy;
  }
  draw(){
    ctx.strokeStyle="black";
    ctx.lineWidth=4;
    ctx.beginPath();
    ctx.moveTo(this.a.x,this.a.y);
    ctx.lineTo(this.b.x,this.b.y);
    ctx.stroke();
  }
}

function spawnRagdoll(){
  health=maxHealth;
  updateHealth();
  ragdollParts=[];
  constraints=[];

  let mid=canvas.width/2;

  let head=new Part(mid,120,18);
  let body=new Part(mid,170,25);
  let lArm=new Part(mid-40,170,10);
  let rArm=new Part(mid+40,170,10);
  let lLeg=new Part(mid-25,270,12);
  let rLeg=new Part(mid+25,270,12);

  ragdollParts=[head,body,lArm,rArm,lLeg,rLeg];

  constraints=[
    new Constraint(head,body,45),
    new Constraint(body,lArm,55),
    new Constraint(body,rArm,55),
    new Constraint(body,lLeg,90),
    new Constraint(body,rLeg,90)
  ];
}

function damage(amount){
  health-=amount;
  if(health<0)health=0;
  updateHealth();
  if(health===0){
    setTimeout(spawnRagdoll,1000);
  }
}

function updateHealth(){
  document.getElementById("healthFill").style.width=
    (health/maxHealth*100)+"%";
  document.getElementById("healthFill").style.background=
    health>50?"lime":health>20?"orange":"red";
}

function updateCoins(){
  document.getElementById("coins").innerText=coins;
}

canvas.addEventListener("pointerdown",e=>{
  const rect=canvas.getBoundingClientRect();
  const mx=e.clientX-rect.left;
  const my=e.clientY-rect.top;

  if(currentWeapon==="bat"||currentWeapon==="hammer"){
    weaponObj={x:mx,y:my,type:currentWeapon};
  }

  if(currentWeapon==="bomb"){
    bombs.push({x:mx,y:my,timer:60});
  }

  ragdollParts.forEach(p=>{
    let dx=p.x-mx;
    let dy=p.y-my;
    if(Math.sqrt(dx*dx+dy*dy)<30){
      draggingPart=p;
      if(currentWeapon==="punch"){
        p.oldx-=dx*0.4;
        damage(5);
        coins+=1;
        updateCoins();
      }
    }
  });
});

canvas.addEventListener("pointermove",e=>{
  const rect=canvas.getBoundingClientRect();
  const mx=e.clientX-rect.left;
  const my=e.clientY-rect.top;

  if(draggingPart){
    draggingPart.x=mx;
    draggingPart.y=my;
  }

  if(weaponObj){
    weaponObj.x=mx;
    weaponObj.y=my;
  }
});

canvas.addEventListener("pointerup",()=>{
  draggingPart=null;
  weaponObj=null;
});

function update(){
  constraints.forEach(c=>c.update());
  ragdollParts.forEach(p=>p.update());

  if(weaponObj){
    ragdollParts.forEach(p=>{
      let dx=p.x-weaponObj.x;
      let dy=p.y-weaponObj.y;
      let dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<40){
        p.oldx-=dx*0.8;
        damage(weaponObj.type==="hammer"?12:8);
        coins+=weaponObj.type==="hammer"?3:2;
        updateCoins();
      }
    });
  }

  bombs.forEach(b=>{
    b.timer--;
    if(b.timer<=0){
      ragdollParts.forEach(p=>{
        let dx=p.x-b.x;
        let dy=p.y-b.y;
        if(Math.sqrt(dx*dx+dy*dy)<150){
          p.oldx-=dx*0.7;
          damage(20);
        }
      });
      coins+=5;
      updateCoins();
      b.exploded=true;
    }
  });

  bombs=bombs.filter(b=>!b.exploded);
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  constraints.forEach(c=>c.draw());
  ragdollParts.forEach(p=>p.draw());

  if(weaponObj){
    if(weaponObj.type==="bat"){
      ctx.fillStyle="#8b5a2b";
      ctx.fillRect(weaponObj.x-5,weaponObj.y-40,10,80);
    }
    if(weaponObj.type==="hammer"){
      ctx.fillStyle="#8b5a2b";
      ctx.fillRect(weaponObj.x-4,weaponObj.y-40,8,60);
      ctx.fillStyle="#555";
      ctx.fillRect(weaponObj.x-15,weaponObj.y-45,30,15);
    }
  }

  bombs.forEach(b=>{
    ctx.fillStyle="black";
    ctx.beginPath();
    ctx.arc(b.x,b.y,12,0,Math.PI*2);
    ctx.fill();
  });
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

});
</script>
</body>
</html>
